
services:

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chat_network

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=chat_app
      - JWT_SECRET=supersecretkey-changethis-inproduction
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_MINUTES=60
    networks:
      - chat_network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    networks:
      - chat_network

networks:
  chat_network:
    driver: bridge

volumes:
  mongo_data: